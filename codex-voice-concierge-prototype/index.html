<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="voice-token" content="__TOKEN__">
<title>Codex Voice Mode</title>
<style>:root{color-scheme:dark;background:#181818;color:#d4d4d4}@media(prefers-color-scheme:light){:root{color-scheme:light;background:#fff;color:#191c1e}}</style>
<link rel="stylesheet" href="/frontend/styles.css">
<link rel="stylesheet" href="/frontend/chat-picker.css">
</head>
<body data-view="transcript">
<header class="app-header" aria-label="Selected Codex chat"><div class="chat-eyebrow"><select id="threads" aria-label="Codex chat state" hidden disabled><option>Loading chats…</option></select><div id="chat-picker-root"></div></div></header>
<div class="voice-dock">

<header class="topbar" aria-label="Voice session controls">
 <div class="toolbar">
  <div class="chat-picker"><span id="waveform" role="img" aria-label="Voice audio activity"></span></div>
  <div class="controls"><div id="session-meter" data-tooltip="Session duration and estimated voice cost"><span id="session-time">0s</span><span id="session-price">$0.00</span></div><button id="toggle" class="control" aria-label="Enter voice mode" aria-pressed="false" data-tooltip="Start voice session" disabled><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg><svg class="stop-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg></button></div>
 </div>
</header>
<div id="status" role="status">Starting Codex…</div>
</div>
<div id="session-toast" role="status" hidden></div>
<nav class="view-tabs history-nav" aria-label="Session views"><button id="history-tab" type="button" aria-expanded="false" aria-controls="session-history">History</button></nav>
<main>
<section id="transcript-panel" aria-label="Transcript">

 <div id="log"></div>
 <div id="requests" class="muted"></div>
</section>
<section id="session-history" aria-label="Voice sessions" hidden>
 <div class="panel-heading"><h2>Voice sessions</h2><small>Duration / cost</small></div>
 <ul id="session-list"></ul><small class="muted">Voice cost estimates at $3/hour (USD). Excludes handoff-model and Codex costs. Latest 100 sessions saved in this browser; totals may differ from your Gateway invoice.</small>
</section>
</main>
<script type="module" src="/frontend/main.tsx"></script>
</body>
</html>
